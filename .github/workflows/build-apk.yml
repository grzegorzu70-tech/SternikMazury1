name: Zbuduj i opublikuj APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sternik-Mazury-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Publikuj APK w GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          cp "$APK" Sternik-Mazury.apk
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk Sternik-Mazury.apk --clobber
          else
            gh release create latest-apk Sternik-Mazury.apk --title "Sternik Mazury - Android APK" --notes "Wersja instalacyjna Android. Plik APK do bezposredniego pobrania." --latest --target "$GITHUB_SHA"
          fi
