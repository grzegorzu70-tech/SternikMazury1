name: Zbuduj APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Zbuduj APK release
        run: gradle assembleRelease

      - name: Utworz klucz testowy
        run: |
          keytool -genkeypair -v -keystore sternik-test.jks -storepass SternikMazury2026 -keypass SternikMazury2026 -alias sternik -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sternik Mazury, O=Sternik Mazury, C=PL"

      - name: Podpisz APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks sternik-test.jks --ks-key-alias sternik --ks-pass pass:SternikMazury2026 --key-pass pass:SternikMazury2026 --out app/build/outputs/apk/release/Sternik-Mazury.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/Sternik-Mazury.apk

      - name: Zachowaj podpisany APK
        uses: actions/upload-artifact@v4
        with:
          name: Sternik-Mazury-Podpisany-APK
          path: app/build/outputs/apk/release/Sternik-Mazury.apk
          if-no-files-found: error
